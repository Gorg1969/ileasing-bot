name: Parse ileasing.ru

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Run parser
        run: |
          python -m parser.parser

      # ✅ ИСПРАВЛЕНИЕ: сохраняем свежую БД во временное место,
      #    чтобы git checkout -B state её не затёр
      - name: Save fresh listings.db
        run: |
          ls -la data/
          ls -la data/listings.db
          cp data/listings.db /tmp/fresh_listings.db
          echo "Размер свежей БД:"
          stat -c%s /tmp/fresh_listings.db

      - name: Commit to state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Переключаемся на ветку state
          git fetch origin state || true
          git checkout -B state

          # Возвращаем свежую БД на место (git её затёр)
          cp /tmp/fresh_listings.db data/listings.db

          # Проверяем, что размер вырос
          echo "Размер БД перед коммитом:"
          stat -c%s data/listings.db

          git add -f data/listings.db
          git commit -m "chore: update listings.db $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push -f origin state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
