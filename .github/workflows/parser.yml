name: Parse ileasing.ru

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      # ✅ ИСПРАВЛЕНИЕ: скачиваем существующую listings.db из ветки state
      - name: Download existing listings.db from state
        run: |
          mkdir -p data
          echo "Пробуем скачать listings.db из ветки state..."
          curl -fsSL -o data/listings.db \
            https://raw.githubusercontent.com/Gorg1969/ileasing-bot/state/data/listings.db \
            && echo "✅ Скачано: $(stat -c%s data/listings.db) байт" \
            || echo "⚠️ Не удалось скачать, начинаем с нуля"

      - name: Run parser
        run: |
          python -m parser.parser

      - name: Save fresh listings.db
        run: |
          ls -la data/
          ls -la data/listings.db
          cp data/listings.db /tmp/fresh_listings.db
          echo "Размер свежей БД:"
          stat -c%s /tmp/fresh_listings.db

      - name: Commit to state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin state || true
          git checkout -B state

          cp /tmp/fresh_listings.db data/listings.db

          echo "Размер БД перед коммитом:"
          stat -c%s data/listings.db

          git add -f data/listings.db
          git commit -m "chore: update listings.db $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push -f origin state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
